name: Check simulation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check physics.js
      - run: node --check examples.js
      - run: node --test tests/physics.test.cjs
